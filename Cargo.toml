[package]
name = "aigitcommit"
version = "1.9.7"
edition = "2024"
description = "Generate Conventional Commit messages from staged changes using OpenAI-compatible APIs."
license-file = "LICENSE"
readme = "README.md"
keywords = ["git", "tools", "ai", "development"]
authors = ["mingcheng <mingcheng@apache.org>"]
repository = "https://github.com/mingcheng/aigitcommit"
homepage = "https://github.com/mingcheng/aigitcommit"
exclude = ["assets/*"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
reqwest = { version = "0.13", features = [
    "socks",
    "native-tls-vendored",
] }
askama = { version = "0.16", default-features = false, features = ["derive", "std"] }
async-openai = { version = "0.42", features = ["chat-completion", "model"] }
git2 = "0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = "0.3"
arboard = "3.7"
tabled = "0.22"
cliclack = "0.5.6"
regex = "1.13.1"

[[bin]]
name = "aigitcommit"
path = "src/main.rs"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
debug = false

[build-dependencies]
built = { version = "0.8", features = ["chrono"] }
